<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDILOCKS Campaign Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    color:#222;
    padding:30px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#03C75A,#009E49);
    color:white;
    padding:30px;
    border-radius:20px;
    margin-bottom:25px;
}

.header h1{
    font-size:36px;
    margin-bottom:10px;
}

.kpi-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:25px;
}

.kpi{
    background:white;
    padding:24px;
    border-radius:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.kpi-label{
    color:#666;
    font-size:14px;
}

.kpi-value{
    font-size:32px;
    font-weight:bold;
    color:#03C75A;
    margin-top:10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:24px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:20px;
}

.bar{
    margin-bottom:16px;
}

.bar-label{
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
}

.track{
    height:16px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
}

.fill{
    height:100%;
