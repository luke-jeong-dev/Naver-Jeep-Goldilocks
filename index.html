<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOLDILOCKS Marketing Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
color:#222;
padding:30px;
}

.container{
max-width:1400px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#03C75A,#00A64F);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:25px;
box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.header h1{
font-size:38px;
margin-bottom:8px;
}

.header p{
opacity:.9;
}

.kpi-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:25px;
}

.kpi{
background:white;
padding:24px;
border-radius:18px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.kpi-label{
font-size:14px;
color:#666;
}

.kpi-value{
font-size:34px;
font-weight:bold;
margin-top:8px;
color:#03C75A;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:20px;
}

.card{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:15px;
}

.chart{
height:350px;
}

.insight{
background:white;
border-radius:18px;
padding:25px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.insight ul{
padding-left:20px;
margin-top:10px;
}

.insight li{
margin-bottom:10px;
line-height:1.6;
}

.badge{
display:inline-block;
padding:7px 15px;
background:white;
color:#03C75A;
border-radius:99px;
font-weight:bold;
margin-top:12px;
}

@media(max-width:900px){

.kpi-grid{
grid-template-columns:1fr 1fr;
}

.grid{
grid-template-columns:1fr;
}

}
